    addEventListener(

        if (curTime - timestamp < 600000) {
          document.getElementById('music').innerHTML = `♪ ${songName || 'Nothing'}`
        } else {
          document.getElementById('music').innerHTML = `☀ Nothing`
        }
      },
      false
    );

    function hideURLbar() {
      window.scrollTo(0, 1);
    }

    function animateCounter(element, target, duration = 2000) {
      const start = 0;
      const startTime = performance.now();

      function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);

        // Easing function (ease-out cubic)
        const easeOut = 1 - Math.pow(1 - progress, 3);
        const current = Math.floor(start + (target - start) * easeOut);

        element.textContent = current.toLocaleString();

        if (progress < 1) {
          requestAnimationFrame(update);
        }
      }

      requestAnimationFrame(update);
    }

    function startCounters() {
      const workCounter = document.getElementById('work-counter');
      const personalCounter = document.getElementById('personal-counter');

      animateCounter(workCounter, 1006891, 2000);
      animateCounter(personalCounter, 625356, 2000);
    }
    function myFunction() {
      var copyText = document.getElementById("contactLink");
      var range = document.createRange();
      range.selectNode(copyText);
      window.getSelection().addRange(range);

      try {
        // Now that we've selected the anchor text, execute the copy command
        var successful = document.execCommand("copy");
        var msg = successful ? "successful" : "unsuccessful";
        console.log("Copy email command was " + msg);
      } catch (err) {
        console.log("Oops, unable to copy");
      }

      // Remove the selections - NOTE: Should use
      // removeRange(range) when it is supported
      window.getSelection().removeAllRanges();
      // alert("Copied the text: " + copyText.innerHTML);
    }
