    function hideURLbar() {

    function animateCounter(element, target, duration = 2000) {
      const start = 0;
      const startTime = performance.now();

      function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);

        // Easing function (ease-out cubic)
        const easeOut = 1 - Math.pow(1 - progress, 3);
        const current = Math.floor(start + (target - start) * easeOut);

        element.textContent = current.toLocaleString();

        if (progress < 1) {
          requestAnimationFrame(update);
        }
      }

      requestAnimationFrame(update);
    }

    function startCounters() {
      const workCounter = document.getElementById('work-counter');
      const personalCounter = document.getElementById('personal-counter');

      animateCounter(workCounter, 1006891, 2000);
      animateCounter(personalCounter, 625356, 2000);
    }

      // removeRange(range) when it is supported
      window.getSelection().removeAllRanges();
      // alert("Copied the text: " + copyText.innerHTML);
    }

  <script>
    const memoryPhotos = [
      { src: 'https://picsum.photos/seed/india1/800/600', caption: 'Exploring new places' },
      { src: 'https://picsum.photos/seed/india2/800/600', caption: 'Making memories' },
      { src: 'https://picsum.photos/seed/india3/800/600', caption: 'Living the moment' }
    ];
    let currentPhotoIndex = 0;

    function openLightbox(index) {
      currentPhotoIndex = index;
      document.getElementById('lightbox-img').src = memoryPhotos[index].src;
      document.getElementById('lightbox-caption').textContent = memoryPhotos[index].caption;
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox(event) {
      if (!event || event.target.id === 'lightbox' || event.target.classList.contains('lightbox-close')) {
        document.getElementById('lightbox').classList.remove('active');
        document.body.style.overflow = '';
      }
    }

    function navigateLightbox(direction, event) {
      event.stopPropagation();
      currentPhotoIndex = (currentPhotoIndex + direction + memoryPhotos.length) % memoryPhotos.length;
      document.getElementById('lightbox-img').src = memoryPhotos[currentPhotoIndex].src;
      document.getElementById('lightbox-caption').textContent = memoryPhotos[currentPhotoIndex].caption;
    }

    document.addEventListener('keydown', (e) => {
      if (document.getElementById('lightbox').classList.contains('active')) {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') navigateLightbox(-1, e);
        if (e.key === 'ArrowRight') navigateLightbox(1, e);
      }
    });
  </script>
